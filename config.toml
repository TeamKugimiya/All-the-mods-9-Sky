schema_version = 1

[project]
slug = "atm9sky"
name = "All the Mods 9 - To the Sky"
source_locale = "en_us"
target_locale = "zh_tw"

[upstream]
platform = "curseforge"
project_id = "967745"
minecraft_version = "1.20.1"
loader = "forge"
release_channel = "release"

[upstream.curseforge]
mod_loader_type = 1

[paratranz]
project_id = 10577

[source]
archive_roots = ["overrides", "."]
include = [
  "kubejs/assets/**/lang/en_us.json",
]
context_include = [
  "config/ftbquests/quests/chapters/**/*.snbt",
  "config/ftbquests/quests/reward_tables/**/*.snbt",
  "kubejs/client_scripts/jei_info.js",
  "kubejs/client_scripts/tooltips.js",
  "kubejs/startup_scripts/AE2/Universal_Press.js",
  "kubejs/startup_scripts/custom_additions.js",
]
exclude = []
manual_roots = ["source/overrides"]
max_file_size_bytes = 1048576

[convert]
empty_translation_policy = "original"

[[convert.sources]]
name = "kubejs-assets"
type = "json-lang"
source_root = "./source/kubejs/assets"
translation_root = "./translation/kubejs/assets"
paratranz_root = "kubejs/assets"
source_locale = "{source_locale}"
target_locale = "{target_locale}"

[[convert.sources]]
name = "overrides"
type = "json-lang"
source_root = "./source/overrides/assets"
translation_root = "./translation/overrides/assets"
paratranz_root = "overrides/assets"
source_locale = "{source_locale}"
target_locale = "{target_locale}"
empty_translation_policy = "skip"

[build.client]
type = "zip"
include = [
  "translation/config/**",
  "translation/kubejs/**",
  "translation/packmenu/**",
  "translation/resourcepacks/**",
  "translation/vaultpatcher/**",
  "translation/LICENSE",
]
strip_prefix = ["translation/"]
output_filename = "ATM9-TTS-Patches-Client.zip"
allow_empty = false

[[build.client.generated]]
type = "build-target-zip"
source = "overrides"
output_path = "resourcepacks/ATM9-TTS-Patches.zip"

[build.server]
type = "zip"
include = [
  "translation/config/ftbquests/**",
  "translation/config/skyblockbuilder/**",
  "translation/LICENSE",
]
strip_prefix = ["translation/"]
output_filename = "ATM9-TTS-Patches-Server.zip"
allow_empty = false

[build.overrides]
type = "resourcepack"
include = [
  "source/overrides/assets/**",
  "translation/overrides/assets/**",
  "translation/LICENSE",
]
strip_prefix = ["source/overrides/", "translation/overrides/", "translation/"]
pack_meta.pack_format = 15
pack_meta.description = "ATM9 - TTS 模組中文化補丁\n由 §cTeam Kugimiya 釘宮翻譯組§r 製作"
pack_meta.icon = "translation/overrides/pack.png"
output_filename = "ATM9-TTS-Patches.zip"
allow_empty = false

[diff]
ignore_value_patterns = ["^\\s*$"]
